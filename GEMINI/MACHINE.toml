# MACHINE.toml — 実行環境 single source of truth (SPR/ρ→max)
[env]
os = "Win11_25H2"
shell = "pwsh7"
shell_forbidden = ["bash", "sh", "GitBash", "WSL"]
tools = ["pwsh", "go", "cargo", "coreutils"]

[env.path]
append = [
  "C:/Program Files/coreutils/bin/",
  "C:/PATH/",
  "C:/PATH/vcpkg/vcpkg.exe",
  "$env:USERPROFILE/.cargo/bin/",
  "C:/Program Files/Go/bin/go.exe",
  "$env:USERPROFILE/.gemini/config/plugins/ltw-skills-plugin/skills/llm-memory/",
]

[hardware]
spec_file = "HARDWARE_SPECS.md"
max_lines = 200
dev_specs = "5950X/64GB/5070Ti"
query = 'rg.exe "DEV_SPECS|EXEC_SPECS" -A 10 HARDWARE_SPECS.md'

[encoding]
target_ext = ["md", "txt"]
required = "UTF-8 no BOM"
forbidden = ["SJIS", "UTF16"]
write_methods = [
  "[System.IO.File]::WriteAllText($path,$content)",
  "explicit UTF8 params",
]

[shell.invoke]
generic = 'pwsh -c "{cmd}"'
python = 'cd {proj_root}; . .\.venv\Scripts\Activate.ps1; python.exe {args}'
require_exe_suffix = true

[shell.allow]
commands = [
  "curl.exe", "dust.exe", "ffprobe.exe", "lsd.exe",
  "rg.exe", "wget2.exe", "git.exe add", "git.exe commit", "llm-mem.exe",
  "proof-checker.exe", "sec-forensics.exe", "python.exe", "uv.exe", "agy.exe",
]

[shell.deny]
commands = ["git.exe checkout", "git.exe push"]

[agy_cli]
manual = "AGY_CLI.md"
bin = "C:/Users/letwir/AppData/Local/agy/bin/agy.exe"
# Backward-compatible model mappings (retaining gemini and claude while offering granular roles)
models = { gemini = "gemini-3.7-flash", gemini_fast = "gemini-3.7-flash", gemini_pro = "gemini-2.5-pro", claude = "claude-sonnet-4-6", claude_critic = "claude-sonnet-4-6", claude_arch = "claude-opus-4-6", claude_light = "claude-haiku-4-5" }
exec = 'agy.exe --model {model} --dangerously-skip-permissions --print-timeout {timeout} -p "{prompt}"'

[researcher]
axiom = "NoGuesswork ∧ GroundTruthFirst ∧ SynthesizeToArtifact"
trigger = "PrePlanning ∨ Discovery"
pipeline = "Web -> EPUB(Kavita) -> llm-mem(PostgreSQL)"
retry_trigger = "Count(ResearchOrValidationFailures) == 2"
schema = "Facts, Inferences, Unknowns, Sources, Precedents, Constraints, FAILED, ADVICE, ESCALATE"
fact_inference_separation = true
protocol = "subagents/researcher.md"

[auditor]
axiom = "SpecDriftCheck ∧ CategoryTheorySoundness ∧ EffectPurityPurity ∧ PrognosisAudit ∧ BoundedEscalation ∧ AdvisoryIncorporate"
gate = "PreCond(ImplementationPlan) ⇒ invoke_subagent(Auditor) ∧ Assert(Verdict ∈ {'PASS', 'PASS_WITH_ADVISORIES'}) ∧ (PASS_WITH_ADVISORIES ⇒ 聞き入れて修正適用(ApplyAdvisory) ∧ `llm-mem.exe ingest -cat advisory`) ∧ (REJECT ⇒ 修正再試行 ∧ Block(RequestFeedback))"
model = "claude-sonnet-4-6"
fallback = "gemini-3.7-flash"
protocol = "subagents/auditor.md"
exec = 'agy.exe --model claude-sonnet-4-6 --dangerously-skip-permissions --print-timeout 5m -p "{prompt}"'
command = "python.exe scripts/auditor_claude.py --plan {plan_path} --decisions decisions.md --rule CODE_RULE.md --model claude-sonnet-4-6"

[verifier]
axiom = "ProofOverClaim ∧ InformationAsymmetry ∧ DevilsAdvocate ∧ AdvisoryIncorporate"
gate = "PreCond(Walkthrough) ⇒ invoke_subagent(Verifier) ∧ Assert(Verdict ∈ {'PASS', 'PASS_WITH_ADVISORIES'}) ∧ (PASS_WITH_ADVISORIES ⇒ 聞き入れて修正適用(ApplyAdvisory) ∧ `llm-mem.exe ingest -cat advisory`) ∧ (REJECT ⇒ invoke_subagent(Refactorer))"
model = "claude-sonnet-4-6"
fallback = "gemini-3.7-flash"
protocol = "subagents/verifier.md"
exec = 'agy.exe --model claude-sonnet-4-6 --dangerously-skip-permissions --print-timeout 5m -p "{prompt}"'
command = "python.exe scripts/verifier_claude.py --target {target} --rule CODE_RULE.md --model claude-sonnet-4-6"
proof_check = "proof-checker.exe -path {target} -strict"

[refactorer]
axiom = "SurgicalFixOnly ∧ IsomorphismPreservation ∧ ZeroSideEffectLeak"
trigger = "Verifier(REJECT) ∨ ProofCheck(FAIL)"
protocol = "subagents/refactorer.md"

[blackhat]
axiom = "AttackerThreatModeling ∧ ZeroTrustInput ∧ PromptForensics ∧ SupplyChainSentry ∧ HardenedAdvisory ∧ PreInvestigationFetch"
trigger = "SecurityAudit ∨ PromptInjectionCheck ∨ DependabotTriage ∨ LogForensics ∨ MegaDocsGate"
protocol = "subagents/blackhat.md"
knowledge = "llm-mem.exe search -cat sec_cve"

[mega_docs]
gate = "PreCond(sec-forensics.exe mega-check ∧ invoke_subagent(blackhat) ∧ Assert(OverallVerdict == 'PASS'))"
tag_format = "mega-docs-update-YYYYMMDD"

[self_evolve]
engine = "llm-mem.exe analyze -file {diary} -suggest"
taxonomy = "PromptDefect{Underspecified, Contradiction, ImplicitContext, AmbiguousScope, MissingAcceptance, MissingEnvironment} ⊕ AgentDefect{Misreading, KnowledgeGap, Overthinking, ToolFailure, ScopeDrift}"
flow = "PromptDefect ⇒ FeedbackToUser ∧ AgentDefect ⇒ ProposeRulePatch(PERSONA.css)"

[arch]
paradigm = "CT"
note = "Morphism ∘ Functor 整合性"