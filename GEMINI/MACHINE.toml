# MACHINE.toml — 実行環境 single source of truth (SPR/ρ→max)
[env]
os = "Win11_25H2"
shell = "pwsh7"
shell_forbidden = ["bash", "sh", "GitBash", "WSL"]
tools = ["pwsh", "go", "cargo", "coreutils"]

[env.path]
append = [
  "C:/Program Files/coreutils/bin/",
  "C:/PATH/",
  "C:/PATH/vcpkg/vcpkg.exe",
  "$env:USERPROFILE/.cargo/bin/",
  "C:/Program Files/Go/bin/go.exe",
  "$env:USERPROFILE/.gemini/config/plugins/ltw-skills-plugin/skills/llm-memory/",
]

[hardware]
spec_file = "HARDWARE_SPECS.md"
max_lines = 200
dev_specs = "5950X/64GB/5070Ti"
query = 'rg.exe "DEV_SPECS|EXEC_SPECS" -A 10 HARDWARE_SPECS.md'

[encoding]
target_ext = ["md", "txt"]
required = "UTF-8 no BOM"
forbidden = ["SJIS", "UTF16"]
write_methods = [
  "[System.IO.File]::WriteAllText($path,$content)",
  "explicit UTF8 params",
]

[shell.invoke]
generic = 'pwsh -c "{cmd}"'
python = 'cd {proj_root}; .venv\Scripts\Activate.ps1; python.exe {args}'
require_exe_suffix = true

[shell.allow]
commands = [
  "curl.exe", "dust.exe", "ffprobe.exe", "lsd.exe",
  "rg.exe", "wget2.exe", "git.exe add", "git.exe commit", "llm-mem.exe",
  "proof-checker.exe", "sec-forensics.exe", "python.exe", "uv.exe", "agy.exe",
]

[shell.deny]
commands = ["git.exe checkout", "git.exe push"]

[researcher]
axiom = "NoGuesswork ∧ GroundTruthFirst ∧ SynthesizeToArtifact"
trigger = "PrePlanning ∨ Discovery"
protocol = "subagents/researcher.md"

[auditor]
axiom = "SpecDriftCheck ∧ CategoryTheorySoundness ∧ EffectPurityPurity ∧ PrognosisAudit ∧ BoundedEscalation"
gate = "PreCond(ImplementationPlan) ⇒ invoke_subagent(Auditor) ∧ Assert(Verdict == 'PASS') ∧ (REJECT ⇒ 修正再試行 ∧ Block(RequestFeedback))"
protocol = "subagents/auditor.md"
command = "python.exe scripts/auditor_claude.py --plan {plan_path} --decisions decisions.md --rule CODE_RULE.md"

[verifier]
axiom = "ProofOverClaim ∧ InformationAsymmetry ∧ DevilsAdvocate"
gate = "PreCond(Walkthrough) ⇒ invoke_subagent(Verifier) ∧ Assert(Verdict == 'PASS') ∧ (REJECT ⇒ invoke_subagent(Refactorer))"
protocol = "subagents/verifier.md"
proof_check = "proof-checker.exe -path {target} -strict"

[refactorer]
axiom = "SurgicalFixOnly ∧ IsomorphismPreservation ∧ ZeroSideEffectLeak"
trigger = "Verifier(REJECT) ∨ ProofCheck(FAIL)"
protocol = "subagents/refactorer.md"

[blackhat]
axiom = "AttackerThreatModeling ∧ ZeroTrustInput ∧ PromptForensics ∧ SupplyChainSentry ∧ HardenedAdvisory ∧ PreInvestigationFetch"
trigger = "SecurityAudit ∨ PromptInjectionCheck ∨ DependabotTriage ∨ LogForensics ∨ MegaDocsGate"
protocol = "subagents/blackhat.md"
knowledge = "llm-mem.exe search -cat sec_cve"

[mega_docs]
gate = "PreCond(sec-forensics.exe mega-check ∧ invoke_subagent(blackhat) ∧ Assert(OverallVerdict == 'PASS'))"
tag_format = "mega-docs-update-YYYYMMDD"

[self_evolve]
engine = "llm-mem.exe analyze -file {diary} -suggest"
taxonomy = "PromptDefect{Underspecified, Contradiction, ImplicitContext, AmbiguousScope} ⊕ AgentDefect{Misreading, KnowledgeGap, Overthinking, ToolFailure}"
flow = "PromptDefect ⇒ FeedbackToUser ∧ AgentDefect ⇒ ProposeRulePatch(PERSONA.css)"

[arch]
paradigm = "CT"
note = "Morphism ∘ Functor 整合性"